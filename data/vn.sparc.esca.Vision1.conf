<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!-- Only the service itself may own the name. -->
  <policy user="root">
    <allow own="vn.sparc.esca.Vision1"/>
  </policy>

  <!-- Viewers run as the weston user, so group access rather than a user
       rule. Add a client's user to the "camera" group to let it in: anything
       allowed to see frames may also be told what is in them. -->
  <policy group="camera">
    <allow send_destination="vn.sparc.esca.Vision1"/>
    <allow receive_sender="vn.sparc.esca.Vision1"/>
  </policy>

  <policy user="root">
    <allow send_destination="vn.sparc.esca.Vision1"/>
    <allow receive_sender="vn.sparc.esca.Vision1"/>
  </policy>

  <!-- Everyone else is refused by the default deny below. -->
  <policy context="default">
    <deny own="vn.sparc.esca.Vision1"/>
    <deny send_destination="vn.sparc.esca.Vision1"/>
  </policy>
</busconfig>
